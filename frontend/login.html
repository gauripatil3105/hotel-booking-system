
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Login - HotelBook</title>

    <link
            rel="stylesheet"
            href="css/style.css">

</head>


<body>


<header>

    <div class="logo">
        HotelBook
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#hotels">
            Hotels
        </a>

        <a href="index.html#rooms">
            Rooms
        </a>

        <a href="index.html#my-bookings">
            My Bookings
        </a>

    </nav>

</header>



<section class="login-section">

    <div class="login-container">

        <h2>
            Login
        </h2>

        <p>
            Login to manage your hotel bookings.
        </p>


        <form id="login-form">


            <label>
                Email
            </label>

            <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required>


            <label>
                Password
            </label>

            <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required>


            <button
                    type="submit"
                    class="login-button">

                Login

            </button>


        </form>


        <p
                id="login-message"
                class="login-message">
        </p>


        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


    </div>

</section>



<script src="js/login.js"></script>


</body>

</html>
