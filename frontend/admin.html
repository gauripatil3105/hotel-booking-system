
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - HotelBook</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        HotelBook Admin
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#hotels">Hotels</a>
        <a href="index.html#my-bookings">Bookings</a>
    </nav>

</header>


<section class="admin-section">

    <h1>Admin Dashboard</h1>

    <p class="admin-subtitle">
        Manage and monitor the hotel booking system.
    </p>


    <div class="admin-stats">

        <div class="admin-card">
            <h3>Total Users</h3>
            <p id="total-users">0</p>
        </div>

        <div class="admin-card">
            <h3>Total Hotels</h3>
            <p id="total-hotels">0</p>
        </div>

        <div class="admin-card">
            <h3>Total Rooms</h3>
            <p id="total-rooms">0</p>
        </div>

        <div class="admin-card">
            <h3>Total Bookings</h3>
            <p id="total-bookings">0</p>
        </div>

        <div class="admin-card">
            <h3>Total Payments</h3>
            <p id="total-payments">0</p>
        </div>

    </div>


    <div class="admin-bookings">

        <h2>All Bookings</h2>

        <div id="admin-booking-list">
            <p>Loading bookings...</p>
        </div>

    </div>

</section>


<script src="js/admin.js"></script>

</body>

</html>
