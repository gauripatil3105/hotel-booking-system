
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hotel Booking System</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header>

    <div class="logo">
        HotelBook
    </div>


    <a href="#">
        Home
    </a>

    <a href="#hotels">
        Hotels
    </a>

    <a href="#rooms">
        Rooms
    </a>

    <a href="#my-bookings">
        My Bookings
    </a>


    <span id="user-name"></span>


    <a href="login.html"
       id="login-link">
        Login
    </a>


    <a href="#"
       id="logout-link"
       style="display: none;"
       onclick="logoutUser()">
        Logout
    </a>

</header>



<!-- ================================================= -->
<!-- HERO / SEARCH -->
<!-- ================================================= -->

<section class="hero">

    <div class="hero-content">

        <h1>
            Find Your Perfect Stay
        </h1>

        <p>
            Book comfortable hotels and rooms easily.
        </p>


        <div class="search-box">

            <div class="search-item">

                <label>
                    Location
                </label>

                <input
                        type="text"
                        id="location"
                        placeholder="Enter city">

            </div>


            <div class="search-item">

                <label>
                    Check-in
                </label>

                <input
                        type="date"
                        id="check-in">

            </div>


            <div class="search-item">

                <label>
                    Check-out
                </label>

                <input
                        type="date"
                        id="check-out">

            </div>


            <button onclick="searchHotels()">
                Search Hotels
            </button>

        </div>

    </div>

</section>



<!-- ================================================= -->
<!-- HOTELS -->
<!-- ================================================= -->

<section class="hotels"
         id="hotels">

    <h2>
        Popular Hotels
    </h2>


    <div id="hotel-list"
         class="hotel-list">

        <p>
            Loading hotels...
        </p>

    </div>

</section>



<!-- ================================================= -->
<!-- ROOMS -->
<!-- ================================================= -->

<section class="rooms-section"
         id="rooms">

    <h2>
        Available Rooms
    </h2>


    <div id="room-list"
         class="room-list">

        <p>
            Select a hotel to view rooms.
        </p>

    </div>

</section>



<!-- ================================================= -->
<!-- BOOKING -->
<!-- ================================================= -->

<section class="booking-section"
         id="booking">

    <h2>
        Book Your Room
    </h2>


    <div class="booking-form">


        <input
                type="hidden"
                id="selected-room-id">


        <label>
            Room
        </label>

        <input
                type="text"
                id="selected-room"
                readonly
                placeholder="Select a room">



        <label>
            Logged-in User
        </label>

        <input
                type="text"
                id="booking-user-name"
                readonly
                placeholder="Please login first">


        <input
                type="hidden"
                id="booking-user-id">



        <!-- CHECK-IN -->

        <label>
            Check-in Date
        </label>

        <input
                type="date"
                id="booking-check-in"
                required>



        <!-- CHECK-OUT -->

        <label>
            Check-out Date
        </label>

        <input
                type="date"
                id="booking-check-out"
                required>



        <button
                onclick="createBooking()"
                class="confirm-button">

            Confirm Booking

        </button>


        <p id="booking-price"></p>


        <div
                id="booking-confirmation"
                class="booking-confirmation">
        </div>


        <p id="booking-message"></p>

    </div>

</section>



<!-- ================================================= -->
<!-- MY BOOKINGS -->
<!-- ================================================= -->

<section class="my-bookings-section"
         id="my-bookings">

    <h2>
        My Bookings
    </h2>


    <div id="booking-list"
         class="booking-list">

        <p>
            Loading your bookings...
        </p>

    </div>

</section>



<!-- ================================================= -->
<!-- PAYMENT -->
<!-- ================================================= -->

<section class="payment-section"
         id="payment">

    <h2>
        Make Payment
    </h2>


    <div class="payment-form">


        <label>
            Booking ID
        </label>

        <input
                type="number"
                id="payment-booking-id"
                placeholder="Enter booking ID">



        <label>
            Amount
        </label>

        <input
                type="text"
                id="payment-amount"
                readonly
                placeholder="Booking amount will appear here">



        <label>
            Payment Method
        </label>

        <select id="payment-method">

            <option value="">
                Select Payment Method
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="CARD">
                Credit / Debit Card
            </option>

            <option value="NET_BANKING">
                Net Banking
            </option>

        </select>



        <button
                onclick="makePayment()"
                class="payment-button">

            Pay Now

        </button>


        <div
                id="payment-message"
                class="payment-message">
        </div>

    </div>

</section>



<script src="js/script.js"></script>


</body>

</html>
