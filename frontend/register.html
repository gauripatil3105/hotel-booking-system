
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Register - HotelBook</title>

    <link
            rel="stylesheet"
            href="css/style.css">

</head>


<body>


<header>

    <div class="logo">
        HotelBook
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#hotels">
            Hotels
        </a>

        <a href="index.html#rooms">
            Rooms
        </a>

        <a href="index.html#my-bookings">
            My Bookings
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<section class="login-section">

    <div class="login-container">

        <h2>
            Create Account
        </h2>

        <p>
            Register to book hotels and manage your bookings.
        </p>


        <form id="register-form">


            <label>
                Full Name
            </label>

            <input
                    type="text"
                    id="register-name"
                    placeholder="Enter your full name"
                    required>


            <label>
                Email
            </label>

            <input
                    type="email"
                    id="register-email"
                    placeholder="Enter your email"
                    required>


            <label>
                Phone
            </label>

            <input
                    type="tel"
                    id="register-phone"
                    placeholder="Enter your phone number"
                    required>


            <label>
                Password
            </label>

            <input
                    type="password"
                    id="register-password"
                    placeholder="Create a password"
                    required>


            <button
                    type="submit"
                    class="login-button">

                Create Account

            </button>


        </form>


        <p
                id="register-message"
                class="login-message">
        </p>


        <p class="register-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</section>



<script src="js/register.js"></script>


</body>

</html>
